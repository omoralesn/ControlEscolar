<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Grupos</h1>
    <p>El periodo se elige del plan. Aula y capacidad limitan la inscripción.</p>
    <form th:action="@{/grupos}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Programa
            <select name="programaId">
                <option th:each="programa : ${programas}" th:value="${programa.id}" th:text="${programa.nombre}"></option>
            </select>
        </label>
        <label>Grupo <input name="nombre" required></label>
        <label>Periodo del plan
            <select name="periodoOrden">
                <option value="">Elegir del catálogo</option>
                <option th:each="periodo : ${periodos}" th:value="${periodo.orden}"
                        th:text="${periodo.orden + ' · ' + periodo.nombre}"></option>
            </select>
        </label>
        <label>Periodo que no está en el catálogo <input name="periodoNuevo" type="number" min="1"></label>
        <label>Edificio <input name="edificio"></label>
        <label>Aula <input name="aula"></label>
        <label>Capacidad <input name="capacidad" type="number" min="1" required></label>
        <button type="submit">Registrar grupo</button>
    </form>
    <table>
        <tr>
            <th>Grupo</th><th>Periodo</th><th>Edificio</th><th>Aula</th><th>Capacidad</th>
        </tr>
        <tr th:each="grupo : ${grupos}">
            <td th:text="${grupo.nombre}"></td>
            <td th:text="${grupo.periodoOrden}"></td>
            <td th:text="${grupo.edificio}"></td>
            <td th:text="${grupo.aula}"></td>
            <td th:text="${grupo.capacidad}"></td>
        </tr>
    </table>
</section>
</body>
</html>
