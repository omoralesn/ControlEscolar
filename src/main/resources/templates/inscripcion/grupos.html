<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Grupos y plantilla</h1>
    <form th:action="@{/grupos}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Programa
            <select name="programaId">
                <option th:each="programa : ${programas}" th:value="${programa.id}" th:text="${programa.nombre}"></option>
            </select>
        </label>
        <label>Grupo <input name="nombre" required></label>
        <label>Periodo <input name="periodoOrden" type="number" min="1" required></label>
        <button type="submit">Registrar grupo</button>
    </form>
    <form th:action="@{/profesores}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Profesor <input name="nombre" required></label>
        <button type="submit">Registrar profesor</button>
    </form>
    <form th:action="@{/horarios}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Grupo
            <select name="grupoId">
                <option th:each="grupo : ${grupos}" th:value="${grupo.id}" th:text="${grupo.nombre}"></option>
            </select>
        </label>
        <label>Profesor
            <select name="profesorId">
                <option th:each="profesor : ${profesores}" th:value="${profesor.id}" th:text="${profesor.nombre}"></option>
            </select>
        </label>
        <label>Asignatura <input name="asignatura" required></label>
        <label>Día <input name="dia" required></label>
        <label>Inicio <input name="horaInicio" required placeholder="08:00"></label>
        <label>Fin <input name="horaFin" required placeholder="09:00"></label>
        <button type="submit">Asignar horario</button>
    </form>
    <table>
        <tr th:each="horario : ${horarios}">
            <td th:text="${horario.grupo.nombre}"></td>
            <td th:text="${horario.profesor.nombre}"></td>
            <td th:text="${horario.asignaturaClave}"></td>
            <td th:text="${horario.dia + ' ' + horario.horaInicio + '-' + horario.horaFin}"></td>
        </tr>
    </table>
</section>
</body>
</html>
