<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Profesores</h1>
    <table>
        <tr th:each="profesor : ${profesores}">
            <td th:text="${profesor.nombre}"></td>
        </tr>
    </table>
    <form th:action="@{/profesores}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Profesor que no está en el catálogo <input name="nombre" required></label>
        <button type="submit">Registrar profesor</button>
    </form>
</section>
</body>
</html>
