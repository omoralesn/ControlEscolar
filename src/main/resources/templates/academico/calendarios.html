<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Calendarios</h1>
    <p>En básica la escuela adopta el calendario oficial. En media superior y superior cada escuela publica el suyo.</p>
    <h2>Oficial de básica</h2>
    <table>
        <tr th:each="calendario : ${oficiales}">
            <td th:text="${calendario.ciclo.nombre}"></td>
            <td th:text="${calendario.nivel}"></td>
            <td th:text="${calendario.diasEfectivos}"></td>
        </tr>
    </table>
</section>
</body>
</html>
