<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Programa</h1>
    <p>La escuela adopta un plan rector y, si es particular, anexa materias propias.</p>
    <form th:action="@{/planes/adoptar}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Plan rector
            <select name="planVersionId">
                <option th:each="version : ${versiones}" th:value="${version.id}"
                        th:text="${version.planRector.nombre + ' v' + version.numero}"></option>
            </select>
        </label>
        <label>Nombre del programa <input name="nombre" required></label>
        <button type="submit">Adoptar</button>
    </form>
    <form th:action="@{/planes/anexar}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Programa
            <select name="programaId">
                <option th:each="programa : ${programas}" th:value="${programa.id}" th:text="${programa.nombre}"></option>
            </select>
        </label>
        <label>Clave <input name="clave" required></label>
        <label>Materia complementaria <input name="nombre" required></label>
        <button type="submit">Anexar</button>
    </form>
    <table>
        <tr th:each="programa : ${programas}">
            <td th:text="${programa.nombre}"></td>
            <td th:text="${programa.planVersion.estado}"></td>
        </tr>
    </table>
    <form th:action="@{/planes/cerrar}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Versión a cerrar
            <select name="planVersionId">
                <option th:each="programa : ${programas}" th:value="${programa.planVersion.id}"
                        th:text="${programa.nombre}"></option>
            </select>
        </label>
        <button type="submit">Cerrar versión del plan</button>
    </form>
    <form th:action="@{/planes/esquema}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <p>En media superior y superior la escuela define la aprobatoria, cuántas evaluaciones ordinarias tiene y si usa extraordinarios o segundos cursos. Básica no se edita.</p>
        <label>Programa
            <select name="planVersionId">
                <option th:each="programa : ${programas}" th:value="${programa.planVersion.id}"
                        th:text="${programa.nombre}"></option>
            </select>
        </label>
        <label>Aprobatoria <input name="aprobatoria" type="number" step="0.1" required></label>
        <label>Evaluaciones <input name="ordinarios" type="number" min="1" required></label>
        <label>Extraordinarios <input name="extraordinarios" type="checkbox" value="true"></label>
        <label>Segundos cursos <input name="segundoCurso" type="checkbox" value="true"></label>
        <button type="submit">Configurar esquema</button>
    </form>
</section>
</body>
</html>
