<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Consulta del tutor</h1>
    <p th:text="'Matrícula: ' + ${matricula}"></p>
    <h2>Evaluaciones publicadas</h2>
    <table>
        <tr th:each="evaluacion : ${consulta.evaluaciones}">
            <td th:text="${evaluacion.asignaturaClave}"></td>
            <td th:text="${evaluacion.valor != null ? evaluacion.valor : evaluacion.observacion}"></td>
        </tr>
    </table>
    <h2>Avisos</h2>
    <p th:each="aviso : ${consulta.avisos}" th:text="${aviso.texto}"></p>
    <h2>Cambiar clave</h2>
    <form th:action="@{/padres/clave}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Nueva clave <input name="claveTutor" required minlength="6" autocomplete="off"></label>
        <button type="submit">Guardar</button>
    </form>
</section>
</body>
</html>
