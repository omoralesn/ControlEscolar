<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Calificaciones</h1>
    <p>La captura usa el momento del esquema del alumno. Preescolar guarda observación. El extraordinario pide acta.</p>
    <table>
        <tr th:each="momento : ${momentos}">
            <td th:text="${momento.id}"></td>
            <td th:text="${momento.nombre}"></td>
            <td th:text="${momento.tipo}"></td>
        </tr>
    </table>
    <form th:action="@{/calificaciones}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Alumno <input name="alumnoId" type="number" required></label>
        <label>Asignatura <input name="asignatura" required></label>
        <label>Periodo <input name="periodoOrden" type="number" min="1" required></label>
        <label>Momento <input name="momentoId" type="number" required></label>
        <label>Valor <input name="valor"></label>
        <label>Observación <input name="observacion"></label>
        <label>Acta <input name="acta"></label>
        <label>Complementaria <input name="complementaria" type="checkbox" value="true"></label>
        <button type="submit">Capturar</button>
    </form>
    <form th:action="@{/calificaciones/faltas}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Alumno <input name="alumnoId" type="number" required></label>
        <label>Asignatura <input name="asignatura" required></label>
        <label>Periodo <input name="periodoOrden" type="number" min="1" required></label>
        <label>Momento <input name="momentoId" type="number" required></label>
        <label>Faltas de la materia <input name="faltas" type="number" min="0" required></label>
        <button type="submit">Registrar faltas</button>
    </form>
</section>
</body>
</html>
