<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Planteles</h1>
    <p>Suspender el plantel cierra el acceso de todas sus CCT.</p>
    <table>
        <tr th:each="plantel : ${planteles}">
            <td th:text="${plantel.nombre}"></td>
            <td th:text="${plantel.activo} ? 'Activo' : 'Suspendido'"></td>
            <td>
                <form th:action="@{/acceso/planteles/{id}/suspender(id=${plantel.id})}" method="post">
                    <input th:replace="~{comun/csrf :: token}">
                    <button type="submit">Cortar plantel</button>
                </form>
                <form th:action="@{/acceso/planteles/{id}/activar(id=${plantel.id})}" method="post">
                    <input th:replace="~{comun/csrf :: token}">
                    <button type="submit">Activar plantel</button>
                </form>
            </td>
        </tr>
    </table>
</section>
</body>
</html>
