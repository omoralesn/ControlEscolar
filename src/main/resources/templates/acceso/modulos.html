<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Módulos</h1>
    <p th:text="${escuela.nombre}"></p>
    <form th:action="@{/acceso/modulos}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <input type="hidden" name="institucionId" th:value="${escuelaId}">
        <label th:each="modulo : ${modulos}">
            <input type="checkbox" name="habilitados" th:value="${modulo}"
                   th:checked="${modulosActivos.contains(modulo)}">
            <span th:text="${modulo}"></span>
        </label>
        <button type="submit">Guardar módulos</button>
    </form>
</section>
</body>
</html>
