<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Perfiles</h1>
    <form th:action="@{/perfiles}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Nombre <input name="nombre" required></label>
        <fieldset>
            <legend>Permisos de módulos activos</legend>
            <label th:each="permiso : ${disponibles}">
                <input type="checkbox" name="codigos" th:value="${permiso.codigo}">
                <span th:text="${permiso.codigo}"></span>
            </label>
        </fieldset>
        <button type="submit">Crear perfil</button>
    </form>
    <form th:action="@{/perfiles/usuarios}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Nombre <input name="nombre" required></label>
        <label>Usuario <input name="login" required></label>
        <label>Contraseña <input name="clave" required></label>
        <label>Perfil
            <select name="perfilId">
                <option th:each="perfil : ${perfiles}" th:value="${perfil.id}" th:text="${perfil.nombre}"></option>
            </select>
        </label>
        <button type="submit">Crear usuario</button>
    </form>
    <table>
        <tr th:each="perfil : ${perfiles}">
            <td th:text="${perfil.nombre}"></td>
        </tr>
    </table>
</section>
</body>
</html>
