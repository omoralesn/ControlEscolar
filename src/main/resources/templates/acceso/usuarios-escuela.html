<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Usuarios</h1>
    <p>Los perfiles los define el super. El detalle de la cuenta (rol, bloqueo y credencial) se abre aparte.</p>
    <form th:if="${puedeCapturar}" th:action="@{/usuarios}" method="post">
        <input th:replace="~{comun/csrf :: token}">
        <label>Nombre <input name="nombre" required></label>
        <label>Usuario <input name="login" required></label>
        <label>Contraseña <input name="clave" type="password" minlength="6" required></label>
        <label>Perfil
            <select name="perfilId" required>
                <option value="" disabled selected>Seleccione</option>
                <option th:each="perfil : ${perfiles}" th:value="${perfil.id}" th:text="${perfil.nombre}"></option>
            </select>
        </label>
        <button type="submit">Crear usuario</button>
    </form>
    <p th:unless="${puedeCapturar}">Tu perfil no permite capturar usuarios.</p>
    <table>
        <tr>
            <th>Usuario</th><th>Nombre</th><th>Rol</th><th>Perfil</th><th>Cuenta</th><th></th>
        </tr>
        <tr th:each="fila : ${usuarios}">
            <td th:text="${fila.usuario.login}"></td>
            <td th:text="${fila.usuario.nombre}"></td>
            <td th:text="${fila.usuario.alcance}"></td>
            <td th:text="${fila.perfilNombre}"></td>
            <td th:text="${fila.usuario.accountNonLocked and fila.usuario.enabled} ? 'Entra' : 'No entra'"></td>
            <td><a th:href="@{/usuarios/{id}(id=${fila.usuario.id})}">Cuenta</a></td>
        </tr>
    </table>
</section>
</body>
</html>
