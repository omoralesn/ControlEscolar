<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Usuarios</h1>
    <p>Módulo independiente de la escuela. Elija la institución para dar de alta
        usuarios de registro o altas excepcionales.</p>
    <table>
        <tr th:each="escuela : ${escuelas}">
            <td th:text="${escuela.claveCct}"></td>
            <td th:text="${escuela.nombre}"></td>
            <td th:text="${escuela.nivel}"></td>
            <td><a th:href="@{/acceso/escuelas/{id}/usuarios(id=${escuela.id})}">Administrar usuarios</a></td>
        </tr>
    </table>
</section>
</body>
</html>
