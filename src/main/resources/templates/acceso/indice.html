<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{comun/layout :: pagina(~{::contenido})}">
<body>
<section th:fragment="contenido">
    <h1>Acceso</h1>
    <p>Elige una escuela para asignar CCT, módulos, usuarios y perfiles.</p>
    <table>
        <tr>
            <th>Escuela</th>
            <th>Nivel</th>
            <th>Estado</th>
            <th></th>
        </tr>
        <tr th:each="escuela : ${escuelas}">
            <td th:text="${escuela.nombre}"></td>
            <td th:text="${escuela.nivel}"></td>
            <td th:text="${escuela.activa} ? 'Activa' : 'Suspendida'"></td>
            <td><a th:href="@{/acceso/escuelas/{id}(id=${escuela.id})}">Administrar</a></td>
        </tr>
    </table>
    <h2>Planteles</h2>
    <table>
        <tr th:each="plantel : ${planteles}">
            <td th:text="${plantel.nombre}"></td>
            <td th:text="${plantel.activo} ? 'Activo' : 'Suspendido'"></td>
        </tr>
    </table>
</section>
</body>
</html>
