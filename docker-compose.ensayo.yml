services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: controlescolar
      POSTGRES_USER: controlescolar
      POSTGRES_PASSWORD: controlescolar
    ports:
      - "5433:5432"

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"

  wildfly:
    build:
      context: .
      dockerfile: docker/wildfly/Dockerfile
    depends_on:
      - postgres
      - mongo
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/controlescolar
